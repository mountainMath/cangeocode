url: https://mountainmath.github.io/cangeocode/

template:
  bootstrap: 5

reference:
- title: Geocoding
  desc: >
    Resolve free-text Canadian addresses to coordinates, interpolating the
    civic numbers NAR does not carry.
  contents:
  - geocode

- title: Address normalization
  desc: >
    Parse free-text Canadian addresses into the components NAR is keyed on,
    sort them by the shape they parsed as, and put them back together as a
    match key or a readable line. Useful on its own for matching and
    deduplicating address lists, not only as a step towards a coordinate.
  contents:
  - normalize_address
  - address_pattern
  - address_key
  - format_address

- title: External geocoders
  desc: >
    The Province of British Columbia's Address Geocoder, as a fallback for BC
    addresses NAR cannot place and as an independent source to validate
    against. Makes network requests.
  contents:
  - bc_geocode
  - bc_validate

- title: Reverse geocoding
  desc: >
    Find the addresses nearest a coordinate.
  contents:
  - reverse_geocode

- title: The NAR database
  desc: >
    Download and open a National Address Repository release, and get query
    results back as `sf`.
  contents:
  - nar_connection
  - nar_provinces
  - available_nar_versions
  - collect_nar

articles:
- title: Geocoding
  navbar: Geocoding
  contents:
  - cangeocode
  - geocoding

- title: Address normalization
  navbar: Address normalization
  contents:
  - address-normalization

- title: The database
  navbar: The database
  contents:
  - querying-nar
