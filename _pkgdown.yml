url: https://mountainmath.github.io/cangeocode/

template:
  bootstrap: 5

reference:
- title: Geocoding
  desc: >
    Resolve free-text Canadian addresses to coordinates, interpolating the
    civic numbers NAR does not carry. `geocode()` answers one row per address;
    `geocode_matches()` opens up the NAR records behind an answer, which is
    where the units of a multi-unit building are.
  contents:
  - geocode
  - geocode_matches

- title: Address normalization
  desc: >
    Parse free-text Canadian addresses into the components NAR is keyed on,
    sort them by the shape they parsed as, and put them back together as a
    match key or a readable line. Useful on its own for matching and
    deduplicating address lists, not only as a step towards a coordinate.
  contents:
  - normalize_address
  - address_pattern
  - address_key
  - format_address

- title: External geocoders
  desc: >
    Online services that place an address without a local database: NRCan's
    national geolocator, the Province of British Columbia's Address Geocoder,
    Quebec's geocoder over the Repertoire quebecois des adresses, the two
    provincial ones also a second source to check a result against, and the
    OpenStreetMap geocoder Natural Resources Canada hosts. All make network
    requests, and the OpenStreetMap one returns data under a share-alike
    licence -- read `osm_geocode()` before using its results.
  contents:
  - nrcan_geocode
  - bc_geocode
  - bc_validate
  - qc_geocode
  - qc_validate
  - osm_geocode

- title: Reverse geocoding
  desc: >
    Find the addresses nearest a coordinate. `reverse_geocode()` is NAR-backed
    and local; `qc_reverse_geocode()` is the one online reverse geocoder here,
    and it covers Quebec only.
  contents:
  - reverse_geocode
  - qc_reverse_geocode

- title: The NAR database
  desc: >
    Download and open a National Address Repository release, and get query
    results back as `sf`. `geocode()` and `reverse_geocode()` open a connection
    themselves when they are not given one, so these are for naming a release,
    querying the database directly, or controlling when the connection is held.
  contents:
  - open_nar
  - close_nar
  - nar_connection
  - nar_provinces
  - available_nar_versions
  - collect_nar

- title: The Quebec address register
  desc: >
    Import the Repertoire quebecois des adresses into the same database
    alongside NAR, in tables of its own. Optional, Quebec only, and what the
    `"rqa"` tier of `geocode()` reads. The register is CC-BY 4.0 where the rest
    of this package's data is OGL, so anything published from it has to carry
    `rqa_attribution()`.
  contents:
  - rqa_import
  - rqa_attribution

- title: The road network file
  desc: >
    Import Statistics Canada's Road Network File into the same database
    alongside NAR, in tables of its own. Optional, national, and what the
    `"rnf"` tier of `geocode()` reads: it places a civic number along the street
    segment whose address range contains it, which reaches streets NAR does not
    carry at all.
  contents:
  - rnf_import

